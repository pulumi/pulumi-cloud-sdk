name: Release

on:
  push:
    tags:
      - 'v*--*'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute version from tag
        id: version
        run: |
          # Tag is v<YYYY-MM-DD>--<HHMM> (e.g. v2026-08-24--0814). On an
          # ordinary day with a single release, publish a plain
          # "<year>.<month>.<day>" (e.g. 2026.8.24) — a normal release on
          # every registry, no flags needed to install it.
          #
          # If another tag from the same date already exists, append the
          # time as a PEP 440 post-release instead ("<year>.<month>.<day>
          # -post<HHMM>", e.g. 2026.8.24-post1530). PyPI treats .postN as a
          # normal (non-prerelease) release, so pip still installs it by
          # default; npm accepts it as valid semver. NuGet treats any
          # hyphenated suffix as prerelease and would need --prerelease for
          # these same-day extra releases, but that only affects the rare
          # multi-release-per-day case, not the common path above.
          raw="${GITHUB_REF_NAME#v}"
          date_part="${raw%%--*}"
          time_part="${raw#*--}"
          IFS='-' read -r y m d <<< "$date_part"
          m=$((10#$m))
          d=$((10#$d))

          other_same_day="$(git tag -l "v${date_part}--*" | grep -v -x "${GITHUB_REF_NAME}" || true)"

          if [ -z "$other_same_day" ]; then
            version="${y}.${m}.${d}"
          else
            version="${y}.${m}.${d}-post${time_part}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish_go:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the Go submodule
        run: |
          git config user.name "pulumi-bot"
          git config user.email "bot@pulumi.com"
          git tag "go/v${{ needs.prepare.outputs.version }}"
          git push origin "go/v${{ needs.prepare.outputs.version }}"

  publish_nodejs:
    name: publish to npm
    needs: prepare
    environment: publish-npm
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Ensure npm meets the trusted-publishing floor
        # mise installs a Node LTS with an older bundled npm; trusted
        # publishing requires npm >= 11.5.1.
        run: npm install -g npm@11.5.1
      - name: Publish
        run: make publish_nodejs VERSION=${{ needs.prepare.outputs.version }}

  publish_python:
    name: publish to PyPI
    needs: prepare
    # PyPI's Trusted Publisher is bound to this exact environment name and
    # workflow filename; both must match for OIDC to be accepted.
    environment: publish-pypi
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Build distribution
        run: make build_dist_python VERSION=${{ needs.prepare.outputs.version }}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  publish_dotnet:
    name: publish to NuGet
    needs: prepare
    # NuGet's Trusted Publisher policy is bound to (repo owner, repo,
    # workflow filename, environment); this must match the policy on
    # nuget.org.
    environment: publish-nuget
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # Fetch NUGET_USER (the nuget.org policy-owner profile slug; not
      # secret but kept in ESC for consistency with the rest of the
      # publishing config).
      - env:
          ESC_ACTION_ENVIRONMENT: github-secrets/${{ github.repository_owner }}-${{ github.event.repository.name }}
          ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: "false"
          ESC_ACTION_OIDC_AUTH: "true"
          ESC_ACTION_OIDC_ORGANIZATION: pulumi
          ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
        id: esc-secrets
        name: Fetch secrets from ESC
        uses: pulumi/esc-action@9eb774255b1a4afb7855678ae8d4a77359da0d9b
      - name: Pack
        run: make pack_dotnet VERSION=${{ needs.prepare.outputs.version }}
      # Exchange the GitHub OIDC token for a short-lived (~1h, single-use)
      # nuget.org API key.
      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ steps.esc-secrets.outputs.NUGET_USER }}
      - name: Push
        run: |
          cd dotnet
          dotnet nuget push 'nupkg/*.nupkg' \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"

  publish_java:
    name: publish to Maven Central
    needs: prepare
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - env:
          ESC_ACTION_ENVIRONMENT: github-secrets/${{ github.repository_owner }}-${{ github.event.repository.name }}
          ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: "false"
          ESC_ACTION_OIDC_AUTH: "true"
          ESC_ACTION_OIDC_ORGANIZATION: pulumi
          ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
        id: esc-secrets
        name: Fetch secrets from ESC
        uses: pulumi/esc-action@9eb774255b1a4afb7855678ae8d4a77359da0d9b
      - name: Publish
        run: make publish_java VERSION=${{ needs.prepare.outputs.version }}
        env:
          SIGNING_KEY: ${{ steps.esc-secrets.outputs.JAVA_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ steps.esc-secrets.outputs.JAVA_SIGNING_PASSWORD }}
          PUBLISH_REPO_USERNAME: ${{ steps.esc-secrets.outputs.OSSRH_USERNAME }}
          PUBLISH_REPO_PASSWORD: ${{ steps.esc-secrets.outputs.OSSRH_PASSWORD }}

  github_release:
    needs: [prepare, publish_go, publish_nodejs, publish_python, publish_dotnet, publish_java]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
